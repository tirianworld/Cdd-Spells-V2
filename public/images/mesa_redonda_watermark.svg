<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" stroke="#bafafd" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <g id="chair">
      <!-- Postes laterales del respaldo -->
      <path d="M 222 135 L 221 72" stroke-width="4.5" />
      <rect x="218" y="66" width="7" height="7" rx="1.5" fill="#bafafd" />

      <path d="M 278 135 L 279 72" stroke-width="4.5" />
      <rect x="275" y="66" width="7" height="7" rx="1.5" fill="#bafafd" />

      <!-- Listón superior del respaldo -->
      <path d="M 221 82 C 238 86 262 86 279 82 L 279 92 C 262 96 238 96 221 92 Z" fill="#bafafd" fill-opacity="0.15" stroke-width="3.5" />

      <!-- Listón inferior del respaldo -->
      <path d="M 222 105 C 238 109 262 109 278 105 L 278 114 C 262 118 238 118 222 114 Z" fill="#bafafd" fill-opacity="0.15" stroke-width="3.5" />

      <!-- Asiento contorneado -->
      <path d="M 224 124 C 238 127 262 127 276 124 L 274 166 C 262 169 238 169 226 166 Z" fill="#bafafd" fill-opacity="0.1" stroke-width="4.5" />

      <!-- Soportes curvos bajo asiento -->
      <path d="M 234 168 C 231 176 242 178 245 170" stroke-width="3" />
      <path d="M 266 168 C 269 176 258 178 255 170" stroke-width="3" />
    </g>

    <g id="flourish">
      <path d="M 241 169 C 246 171 254 171 259 169" stroke-width="3" />
      <circle cx="250" cy="157" r="3.2" fill="#bafafd" />
      <circle cx="242" cy="160" r="2.2" fill="#bafafd" />
      <circle cx="258" cy="160" r="2.2" fill="#bafafd" />
    </g>
  </defs>

  <!-- Mesa Redonda Central con detalles heráldicos -->
  <circle cx="250" cy="250" r="78" stroke-width="5" fill="#bafafd" fill-opacity="0.04" />
  <circle cx="250" cy="250" r="56" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.65" />
  <circle cx="250" cy="250" r="24" stroke-width="2" fill="#bafafd" fill-opacity="0.08" />
  <circle cx="250" cy="250" r="7" fill="#bafafd" stroke="none" opacity="0.5" />

  <!-- Rayos heráldicos a las 8 sillas -->
  <path
    d="M 250 196 L 250 224 M 250 276 L 250 304 M 196 250 L 224 250 M 276 250 L 304 250 M 212 212 L 232 232 M 268 268 L 288 288 M 212 288 L 232 268 M 268 232 L 288 212"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- 8 Sillas -->
  <use href="#chair" transform="rotate(0 250 250)" />
  <use href="#chair" transform="rotate(45 250 250)" />
  <use href="#chair" transform="rotate(90 250 250)" />
  <use href="#chair" transform="rotate(135 250 250)" />
  <use href="#chair" transform="rotate(180 250 250)" />
  <use href="#chair" transform="rotate(225 250 250)" />
  <use href="#chair" transform="rotate(270 250 250)" />
  <use href="#chair" transform="rotate(315 250 250)" />

  <!-- 8 Adornos entre sillas -->
  <use href="#flourish" transform="rotate(22.5 250 250)" />
  <use href="#flourish" transform="rotate(67.5 250 250)" />
  <use href="#flourish" transform="rotate(112.5 250 250)" />
  <use href="#flourish" transform="rotate(157.5 250 250)" />
  <use href="#flourish" transform="rotate(202.5 250 250)" />
  <use href="#flourish" transform="rotate(247.5 250 250)" />
  <use href="#flourish" transform="rotate(292.5 250 250)" />
  <use href="#flourish" transform="rotate(337.5 250 250)" />
</svg>
